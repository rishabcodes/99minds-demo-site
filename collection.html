<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop — Collection</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,300;1,9..144,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/layout.css">
  <link rel="stylesheet" href="styles/components.css">
  <link rel="stylesheet" href="styles/animations.css">
  <link rel="stylesheet" href="styles/admin.css">
  <link rel="stylesheet" href="styles/responsive.css">
</head>
<body>

  <div id="nav-root"></div>
  <div id="cart-root"></div>
  <div id="checkout-root"></div>

  <section class="page-hero">
    <div class="page-hero__inner">
      <div id="cashback-widget-root"></div>
      <h1 class="page-title">Shop the Edit</h1>
      <p class="page-subtitle" id="collection-subtitle">Luxury cosmetics — add anything to your bag to see the campaign in action.</p>
    </div>
  </section>

  <section class="section section--light" style="padding-top:0">
    <div class="section__inner">

      <div class="category-tabs" id="category-tabs" role="tablist" aria-label="Product categories" style="margin-top:0;margin-bottom:32px"></div>

      <div class="product-grid" id="product-grid" role="list" aria-label="Products"></div>

    </div>
  </section>

  <div id="footer-root"></div>
  <div id="demo-bar-root"></div>

  <script type="module" src="js/pages/collection.js"></script>
</body>
</html>
