<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="">
  <title>Our Promotion</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,300;1,9..144,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/layout.css">
  <link rel="stylesheet" href="styles/components.css">
  <link rel="stylesheet" href="styles/animations.css">
  <link rel="stylesheet" href="styles/admin.css">
  <link rel="stylesheet" href="styles/responsive.css">
</head>
<body>

  <div id="nav-root"></div>
  <div id="cart-root"></div>
  <div id="checkout-root"></div>

  <!-- ================================================
       CAMPAIGN FEATURE
  ================================================ -->
  <section class="section" id="campaign-feature" aria-labelledby="campaign-headline"
    style="padding-top: calc(var(--nav-height) + var(--section-pad))">
    <div class="section__inner section__inner--split">

      <div class="campaign-card" id="campaign-card" role="region" aria-label="" data-reveal>
        <span class="campaign-card__eyebrow" id="campaign-card-name"></span>
        <div class="campaign-card__number" id="campaign-card-number" aria-label="">
          <span id="campaign-card-pct"></span><span class="campaign-card__percent">%</span>
        </div>
        <p class="campaign-card__label">store credit back</p>
        <p class="campaign-card__min" id="campaign-card-min"></p>
        <div class="campaign-card__status">
          <span class="campaign-card__status-dot" aria-hidden="true"></span>
          <span id="campaign-card-valid"></span>
        </div>
        <div class="campaign-card__logo-row">
          <img src="99minds-logo.svg" alt="Powered by 99minds">
        </div>
      </div>

      <div class="campaign-copy" data-reveal data-delay="160">
        <p class="eyebrow" id="campaign-feature-eyebrow" style="color:var(--color-gold)"></p>
        <h2 id="campaign-headline"></h2>
        <p id="campaign-feature-body"></p>
        <p class="campaign-copy__fine">
          Offer applies automatically. No code required. Powered by 99minds
          location-based promotions.
        </p>
        <a href="collection.html" class="btn btn--gold">Start shopping →</a>
      </div>

    </div>
  </section>


  <!-- ================================================
       LIVE CAMPAIGNS
  ================================================ -->
  <section class="section section--light" id="live-campaigns" aria-labelledby="campaigns-headline">
    <div class="section__inner">

      <p class="eyebrow" data-reveal>99minds · Kelly · Live right now</p>
      <h2 class="section__headline" id="campaigns-headline" data-reveal data-delay="80"></h2>
      <p class="section__subhead" id="campaigns-subhead" data-reveal data-delay="160"></p>

      <div class="campaigns-grid" id="campaigns-grid" aria-label="Active campaigns by customer segment"></div>

    </div>
  </section>


  <!-- Shared footer + demo bar injected by partials.js -->
  <div id="footer-root"></div>
  <div id="demo-bar-root"></div>

  <script type="module" src="js/pages/promotion.js"></script>
</body>
</html>
